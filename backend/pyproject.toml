    "fastapi>=0.136.1",
    "greenlet>=3.5.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=4.10.0",
    "pyotp>=2.9.0",
    "rembg[cpu]>=2.0.50",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.29",
    "redis>=5.0.0",
    "replicate>=0.20.0",
    "resend>=2.30.1",

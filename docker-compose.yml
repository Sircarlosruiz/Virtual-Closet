services:
  postgres:
    image: postgres:16-alpine
    networks:
      - virtual_closet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_closet_dev
    deploy:
      resources:
        limits:
          memory: 2gb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - virtual_closet
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    deploy:
      resources:
        limits:
          memory: 1gb
    networks:
      - virtual_closet
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_API_CORS_ALLOW_METHODS: "GET,PUT,POST,DELETE,HEAD,OPTIONS"
      MINIO_API_CORS_ALLOW_HEADERS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    deploy:
      resources:
        limits:
          memory: 1gb
    networks:
      - virtual_closet
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    networks:
      - virtual_closet
    build:
      context: ./backend
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 1.5gb
    # Run migrations before starting the server (ADR-030: entrypoint pattern for dev)
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./docs/imgs:/app/seed-imgs:ro
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/virtual_closet_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_ORIGINALS: originals
      MINIO_BUCKET_GENERATED: generated
      MINIO_BUCKET_THUMBNAILS: thumbnails
      MINIO_BUCKET_MODEL_THUMBNAILS: model-thumbnails
      SEED_IMGS_DIR: /app/seed-imgs
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FASHN_LOCAL_URL: http://fashn:8000
      TRYOFF_MODEL_URL: http://tryoff-model:8000
      TRYOFF_MODEL_TIMEOUT_SECONDS: "1800"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    networks:
      - virtual_closet
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A core.celery_app worker --loglevel=info -Q vton.generation.normal,vton.generation.priority,tryoff
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/virtual_closet_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_ORIGINALS: originals
      MINIO_BUCKET_GENERATED: generated
      MINIO_BUCKET_THUMBNAILS: thumbnails
      MINIO_BUCKET_MODEL_THUMBNAILS: model-thumbnails
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FASHN_LOCAL_URL: http://fashn:8000
      TRYOFF_MODEL_URL: http://tryoff-model:8000
      TRYOFF_MODEL_TIMEOUT_SECONDS: "1800"
    # Wait for fastapi:healthy so migrations have run before workers process tasks (ADR-030)
    depends_on:
      fastapi:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    networks:
      - virtual_closet
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    deploy:
      resources:
        limits:
          memory: 2gb
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # named volume overlay — preserves container packages (ADR-031)
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://fastapi:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - fastapi

  # ─── GPU Profiles ──────────────────────────────────────────────────────────
  # Start with: docker compose --profile gpu up fashn
  # FASHN VTON v1.5 inference server — maskless try-on, ~8 GB VRAM (NVIDIA GPU).
  # First run downloads ~2 GB of weights; subsequent starts use the cache volume.
  fashn:
    profiles: ["gpu"]
    networks:
      - virtual_closet
    build:
      context: ./docker/fashn
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8002:8000"
    volumes:
      - fashn_weights:/app/weights
      - fashn_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # TryOff: base gated FLUX.2-klein-base-9B + LoRA fal/virtual-tryoff-lora — see docker/flux/README.md
  # Start: docker compose --profile tryoff up -d tryoff-model  (or --profile gpu)
  tryoff-model:
    profiles: ["gpu", "tryoff"]
    networks:
      - virtual_closet
    build:
      context: ./docker/flux
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8003:8000"
    environment:
      TRYOFF_LOW_VRAM: "true"
      TRYOFF_OFFLOAD: "sequential"
      TRYOFF_STEPS: "12"
      TRYOFF_HEIGHT: "512"
      TRYOFF_WIDTH: "512"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    shm_size: "2gb"
    volumes:
      - tryoff_weights:/app/weights
      - tryoff_cache:/app/model_cache
      - ./docker/flux/main.py:/app/main.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    # 137 = SIGKILL (OOM). Avoids infinite reload loop (~18 GB model).
    restart: on-failure:3

networks:
  virtual_closet:
    name: virtual_closet
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  fashn_weights:
  fashn_cache:
  tryoff_weights:
  tryoff_cache:

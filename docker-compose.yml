services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtual_closet_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      BACKEND_URL: http://fastapi:8000
    depends_on:
      - fastapi

  fastapi:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./docs/imgs:/app/seed-imgs:ro
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/virtual_closet_dev
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_ORIGINALS: originals
      MINIO_BUCKET_GENERATED: generated
      MINIO_BUCKET_THUMBNAILS: thumbnails
      MINIO_BUCKET_MODEL_THUMBNAILS: model-thumbnails
      SEED_IMGS_DIR: /app/seed-imgs
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_API_CORS_ALLOW_METHODS: "GET,PUT,POST,DELETE,HEAD,OPTIONS"
      MINIO_API_CORS_ALLOW_HEADERS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A core.celery_app worker --loglevel=info -Q vton.generation.normal,vton.generation.priority
    env_file:
      - ./backend/.env
    # Hybrid dev (make dev-backend + docker celery): backend uses localhost:9000 on the host.
    # On WSL/Docker Desktop that is often NOT the same store as http://minio:9000 inside the network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/virtual_closet_dev
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      # Same MinIO as backend/.env MINIO_ENDPOINT=http://localhost:9000 when API runs on the host
      MINIO_ENDPOINT: http://host.docker.internal:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_ORIGINALS: originals
      MINIO_BUCKET_GENERATED: generated
      MINIO_BUCKET_THUMBNAILS: thumbnails
      MINIO_BUCKET_MODEL_THUMBNAILS: model-thumbnails
      # VTON_PROVIDER, CATVTON_*, REPLICATE_API_KEY come from env_file (backend/.env)
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # CatVTON-Flux self-hosted: worker needs to reach the inference container by name
      CATVTON_LOCAL_URL: http://catvton:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # CatVTON-Flux inference server — requires an NVIDIA GPU.
  # Start with: docker compose --profile gpu up catvton
  # First run downloads ~24 GB of model weights; subsequent starts use the cache volume.
  catvton:
    profiles: ["gpu"]
    build:
      context: ./docker/catvton
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CATVTON_STEPS: ${CATVTON_STEPS:-50}
      CATVTON_GUIDANCE: ${CATVTON_GUIDANCE:-30.0}
    volumes:
      - catvton_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
  minio_data:
  catvton_cache:

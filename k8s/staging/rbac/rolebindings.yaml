apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-binding
  namespace: virtual-closet-staging
subjects:
  - kind: ServiceAccount
    name: frontend
    namespace: virtual-closet-staging
roleRef:
  kind: Role
  name: virtual-closet-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-binding
  namespace: virtual-closet-staging
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: virtual-closet-staging
roleRef:
  kind: Role
  name: virtual-closet-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celery-binding
  namespace: virtual-closet-staging
subjects:
  - kind: ServiceAccount
    name: celery-worker
    namespace: virtual-closet-staging
roleRef:
  kind: Role
  name: virtual-closet-role
  apiGroup: rbac.authorization.k8s.io

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: virtual-closet-ingress
  namespace: virtual-closet-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Garment image uploads can reach ~20MB; nginx default is 1MB
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.virtualcloset.io
        - api.staging.virtualcloset.io
      secretName: virtual-closet-tls
  rules:
    - host: staging.virtualcloset.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.staging.virtualcloset.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
